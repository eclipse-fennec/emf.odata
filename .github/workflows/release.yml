name: Release Build

on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. Only the docs deploy needs the
# pages/id-token scopes; the credential-scoped release step gets its secrets via
# `secrets: inherit` below (verify + docs never see them).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      do-release: true
    secrets: inherit

  docs:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
